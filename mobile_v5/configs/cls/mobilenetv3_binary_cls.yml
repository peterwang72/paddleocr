Global:
  use_gpu: true
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: ./output/mobilenetv3_binary_cls
  save_epoch_step: 5
  eval_batch_step: [0, 200]
  cal_metric_during_train: true
  pretrained_model:
  checkpoints:
  save_inference_dir: ./inference/mobilenetv3_binary_cls
  use_visualdl: false
  infer_img:
  save_res_path: ./output/mobilenetv3_binary_cls/predict.txt

Architecture:
  model_type: cls
  Backbone:
    name: MobileNetV3Binary
    num_classes: 2
    dropout: 0.2

Loss:
  name: CELoss

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    learning_rate: 0.001
  regularizer:
    name: L2
    factor: 0.00001

Metric:
  name: ClsMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/cls/
    label_file_list:
      - ./train_data/cls/train.txt
    transforms:
      - DecodeImage:
          img_mode: RGB
          channel_first: false
      - ResizeImage:
          size: [224, 224]
      - NormalizeImage:
          scale: 1./255.
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
          order: hwc
      - ToCHWImage: null
      - KeepKeys:
          keep_keys: [image, label]
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 64
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/cls/
    label_file_list:
      - ./train_data/cls/val.txt
    transforms:
      - DecodeImage:
          img_mode: RGB
          channel_first: false
      - ResizeImage:
          size: [224, 224]
      - NormalizeImage:
          scale: 1./255.
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
          order: hwc
      - ToCHWImage: null
      - KeepKeys:
          keep_keys: [image, label]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 2
