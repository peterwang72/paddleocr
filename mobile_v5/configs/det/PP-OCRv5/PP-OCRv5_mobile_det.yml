# =============================================================================
# PP-OCRv5_mobile_det 文本检测模型 — 训练/验证配置说明（YAML）
# -----------------------------------------------------------------------------
# 对应网络：Backbone=PPLCNetV3 + Neck=RSEFPN + Head=DBHead，算法为 DB（可微二值化）。
# 使用方式：在仓库根目录执行 python tools/train.py -c <本文件路径>（路径按实际调整）。
# =============================================================================

Global:
  model_name: PP-OCRv5_mobile_det # 模型名称；导出推理模型时用于标识
  debug: false # 是否开启调试输出
  use_gpu: true # 训练是否使用 GPU
  epoch_num: &epoch_num 500 # 总训练轮数；&epoch_num 为锚点，供下文 Make*Map 引用
  log_smooth_window: 20 # 日志滑动平均窗口
  print_batch_step: 100 # 每隔多少 step 打印一次
  save_model_dir: ./output/PP-OCRv5_mobile_det # 权重保存目录
  save_epoch_step: 10 # 每隔多少 epoch 保存检查点
  eval_batch_step:
  - 0 # 起始处评估一次
  - 1500 # 该 step 再评估
  cal_metric_during_train: false # 训练过程中是否持续计算指标（按配置关闭）
  checkpoints: # 恢复训练时可填已有 checkpoint 路径
  pretrained_model: https://paddleocr.bj.bcebos.com/pretrained/PPLCNetV3_x0_75_ocr_det.pdparams # 骨干预训练权重 URL
  save_inference_dir: null # 导出推理模型目录；null 表示不按此项导出
  use_visualdl: false # 是否使用 VisualDL 可视化
  infer_img: doc/imgs_en/img_10.jpg # 文档中的默认单图推理路径示例
  save_res_path: ./checkpoints/det_db/predicts_db.txt # 预测结果文本保存路径
  d2s_train_image_shape: [3, 640, 640] # 动转静等场景下的输入形状参考 [C,H,W]
  distributed: true # 是否按分布式训练配置（多卡）

# -----------------------------------------------------------------------------
# Architecture：检测网络结构（与 ppocr/modeling 中注册名一致）
# -----------------------------------------------------------------------------
Architecture:
  model_type: det # 任务类型：检测
  algorithm: DB # Differentiable Binarization
  Transform: null # 无额外 Transform 模块
  Backbone:
    name: PPLCNetV3 # 轻量骨干；det=True 表示检测分支配置
    scale: 0.75 # 宽度缩放系数（mobile 较小）
    det: True
  Neck:
    name: RSEFPN # 残差注意力增强的 FPN，融合多尺度特征
    out_channels: 96 # 融合后每分支通道（最终 concat 前）
    shortcut: True # RSE 层是否带 shortcut
  Head:
    name: DBHead # 输出概率图等，供 DBPostProcess 生成文字框
    k: 50 # 近似阶跃函数 steepness（DB 论文中的 k）
    fix_nan: True # 训练时对 NaN 做处理，提高数值稳定性

# -----------------------------------------------------------------------------
# Loss：DB 检测损失
# -----------------------------------------------------------------------------
Loss:
  name: DBLoss
  balance_loss: true # 是否做正负样本平衡
  main_loss_type: DiceLoss # 主损失为 Dice
  alpha: 5 # DB 损失公式中与二值化相关的权重之一
  beta: 10
  ohem_ratio: 3 # 在线难例挖掘比例

# -----------------------------------------------------------------------------
# Optimizer：优化器与学习率
# -----------------------------------------------------------------------------
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine # 余弦退火
    learning_rate: 0.001 #(8*8c) # 注释表示与 batch 配置相关的经验学习率
    warmup_epoch: 2 # 预热轮数
  regularizer:
    name: L2
    factor: 5.0e-05

# -----------------------------------------------------------------------------
# PostProcess：验证/推理时从网络输出得到框（与训练标签生成逻辑对应）
# -----------------------------------------------------------------------------
PostProcess:
  name: DBPostProcess
  thresh: 0.3 # 二值化阈值
  box_thresh: 0.6 # 框平均得分下限，低于则丢弃
  max_candidates: 1000 # 单图最多候选轮廓数
  unclip_ratio: 1.5 # 多边形外扩比例（框比收缩文字区域略大）

# -----------------------------------------------------------------------------
# Metric：检测评价指标
# -----------------------------------------------------------------------------
Metric:
  name: DetMetric
  main_indicator: hmean # 以 hmean 作为主指标选最优模型

# -----------------------------------------------------------------------------
# Train：训练集与数据增强流水线
# -----------------------------------------------------------------------------
Train:
  dataset:
    name: SimpleDataSet # 图片路径 + 检测标注列表
    data_dir: ./train_data/icdar2015/text_localization/ # 数据根目录（需按实际修改）
    label_file_list:
      - ./train_data/icdar2015/text_localization/train_icdar2015_label.txt
    ratio_list: [1.0] # 多数据源时可设采样比例
    transforms:
    - DecodeImage: # 读取图像
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null # 将标注编码为训练用格式
    - CopyPaste: null # 复制粘贴增广（null 按实现默认）
    - IaaAugment: # imgaug 风格增广
        augmenter_args:
        - type: Fliplr # 水平翻转
          args:
            p: 0.5
        - type: Affine # 仿射：小角度旋转
          args:
            rotate:
            - -10
            - 10
        - type: Resize # 随机缩放
          args:
            size:
            - 0.5
            - 3
    - EastRandomCropData: # 随机裁剪为固定尺寸 patch
        size:
        - 640
        - 640
        max_tries: 50
        keep_ratio: true
    - MakeBorderMap: # 生成 DB 训练用 border/threshold 相关图
        shrink_ratio: 0.4
        thresh_min: 0.3
        thresh_max: 0.7
        total_epoch: *epoch_num # 与 Global.epoch_num 一致
    - MakeShrinkMap: # 收缩文字区域 mask
        shrink_ratio: 0.4
        min_text_size: 8
        total_epoch: *epoch_num
    - NormalizeImage: # ImageNet 均值方差归一化
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null # HWC -> CHW
    - KeepKeys: # 送入 DataLoader 的字段
        keep_keys:
        - image
        - threshold_map
        - threshold_mask
        - shrink_map
        - shrink_mask
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 8 # 单卡 batch
    num_workers: 8

# -----------------------------------------------------------------------------
# Eval：验证集（流程与训练类似，无随机裁剪与 Make*Map）
# -----------------------------------------------------------------------------
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/icdar2015/text_localization/
    label_file_list:
      - ./train_data/icdar2015/text_localization/test_icdar2015_label.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - DetResizeForTest: # 按测试策略缩放（空表示默认参数，见算子实现）
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys: # 保留原图尺寸与多边形标注供指标计算
        keep_keys:
        - image
        - shape
        - polys
        - ignore_tags
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 2
profiler_options: null # 性能分析选项；null 为关闭
